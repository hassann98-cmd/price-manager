name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: نصب PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: لینت همه‌ی فایل‌های PHP
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null; then
              echo "::error file=$file::syntax error"
              failed=1
            fi
          done < <(find woocommerce-advanced-price-manager tests -name '*.php' -print0)
          exit "$failed"

      - name: تست‌های واحد
        if: matrix.php == '8.3'
        run: php tests/run.php

  php74:
    # چرا جدا از ماتریس بالا: `php -l` روی 8.0 ساختارهای ۸-only (مثل `match`)
    # را قبول می‌کند، پس ناسازگاری با ۷.۴ هرگز در CI دیده نمی‌شد — و همان
    # چیزی بود که ابزار پروفایلینگ هاست «خطای syntax در class-price-engine.php
    # خط ۳۲۲» گزارش کرد. این جاب فقط پارس‌شدن را چک می‌کند، نه اجرا.
    name: PHP 7.4 (فقط پارس)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: نصب PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, json
          coverage: none

      - name: پارس‌شدن همه‌ی فایل‌های PHP با ۷.۴
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::PHP 7.4 parse error"
              php -l "$file" || true
              failed=1
            fi
          done < <(find woocommerce-advanced-price-manager -name '*.php' -print0)
          exit "$failed"

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: نصب وابستگی‌های توسعه
        run: npm ci --no-audit --no-fund

      - name: بررسی سینتکس
        run: |
          set -euo pipefail
          for file in woocommerce-advanced-price-manager/assets/js/*.js; do
            node --check "$file"
            echo "ok: $file"
          done

      - name: اعلان تکراری در اسکریپت‌ها
        run: npm run lint:js

      - name: تست دودی (jsdom)
        run: npm run smoke:js

  packaging:
    name: ترجمه، CSS و بسته‌ی نصب
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: POT تازه است؟
        run: python3 tools/make-pot.py --check

      - name: CSS تیلویند تازه است؟
        run: |
          npm ci --no-audit --no-fund
          npm run check:css

      - name: zip با سورس هم‌خوان است؟
        run: python3 tools/build-zip.py --check
